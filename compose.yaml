name: student-session-booking
services:
  web:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DB_PATH: /data/booking.sqlite3
    volumes:
      - booking_data:/data
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks: [private]
  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    environment:
      BOOKING_DOMAIN: ${BOOKING_DOMAIN:?Run scripts/init.sh and set BOOKING_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web:
        condition: service_healthy
    networks: [private]
networks:
  private:
volumes:
  booking_data:
  caddy_data:
  caddy_config:
